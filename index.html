<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Itinerary Planner</title>
    <meta name="description" content="Personalized day-by-day travel itinerary generator with budget tracking and family-friendly filters." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('error', function(e) {
        if (e.message === 'Script error.' || (e.filename && e.filename.indexOf('disqus') !== -1)) {
          e.preventDefault();
          return true;
        }
      }, true);
      window.onerror = function(msg, url) {
        if (msg === 'Script error.' || (url && url.indexOf('disqus') !== -1)) {
          return true;
        }
      };
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-[#1E232A] antialiased selection:bg-[#E8DFD1] selection:text-[#1E232A]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
